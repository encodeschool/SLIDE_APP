name: Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # Setup SSH
      # --------------------------------------------------
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VDS_SSH_PRIVATE_KEY }}
          VDS_HOST: ${{ secrets.VDS_HOST }}

        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$VDS_HOST" >> ~/.ssh/known_hosts


      # --------------------------------------------------
      # Prepare VDS
      # --------------------------------------------------
      - name: Prepare VDS
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}

        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            "$VDS_USER@$VDS_HOST" << 'EOF'

            set -e

            mkdir -p ~/slideforge

            echo "VDS deployment directory ready."

          EOF


      # --------------------------------------------------
      # Copy project to VDS
      # --------------------------------------------------
      - name: Copy project to VDS
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}

        run: |
          rsync -az --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".env" \
            --exclude "node_modules/" \
            --exclude "dist/" \
            --exclude "build/" \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            ./ "$VDS_USER@$VDS_HOST:~/slideforge/"


      # --------------------------------------------------
      # Validate Docker Compose
      # --------------------------------------------------
      - name: Validate Docker Compose
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}

        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            "$VDS_USER@$VDS_HOST" << 'EOF'

            set -e

            cd ~/slideforge

            echo "Validating Docker Compose..."

            docker compose config

            echo "Docker Compose configuration is valid."

          EOF


      # --------------------------------------------------
      # Deploy Docker
      # --------------------------------------------------
      - name: Deploy Docker
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}

        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            "$VDS_USER@$VDS_HOST" << 'EOF'

            set -e

            cd ~/slideforge

            echo "Building containers..."

            docker compose build

            echo "Starting containers..."

            docker compose up -d

            echo "Waiting for services..."

            sleep 10

            echo "Docker Compose status:"

            docker compose ps

            echo "Checking API container..."

            docker compose exec -T api \
              wget -qO- http://127.0.0.1:8080/actuator/health

            echo

            echo "Cleaning unused images..."

            docker image prune -f

            echo "Docker deployment completed."

          EOF


      # --------------------------------------------------
      # Check API
      # --------------------------------------------------
      - name: Check API
        run: |
          echo "Checking public API..."

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 30 \
            https://api-eduslides.encode.uz/actuator/health

          echo

          echo "API check successful."


      # --------------------------------------------------
      # Check Frontend
      # --------------------------------------------------
      - name: Check frontend
        run: |
          echo "Checking frontend..."

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 30 \
            https://eduslides.encode.uz/

          echo

          echo "Frontend check successful."


      # --------------------------------------------------
      # Check Admin
      # --------------------------------------------------
      - name: Check admin
        run: |
          echo "Checking admin..."

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 30 \
            https://admin-eduslides.encode.uz/

          echo

          echo "Admin check successful."


      # --------------------------------------------------
      # Deployment complete
      # --------------------------------------------------
      - name: Deployment completed
        run: |
          echo "========================================="
          echo "Deployment completed successfully"
          echo "========================================="