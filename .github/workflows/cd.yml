name: Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==================================================
      # NODE.JS FOR GITHUB RUNNER
      # ==================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/admin/package-lock.json


      # ==================================================
      # BUILD WEB FRONTEND
      # ==================================================

      - name: Install web dependencies
        working-directory: apps/web
        run: |
          npm ci


      - name: Build web frontend
        working-directory: apps/web
        run: |
          npm run build


      # ==================================================
      # BUILD ADMIN FRONTEND
      # ==================================================

      - name: Install admin dependencies
        working-directory: apps/admin
        run: |
          npm ci


      - name: Build admin frontend
        working-directory: apps/admin
        run: |
          npm run build


      # ==================================================
      # VERIFY BUILDS
      # ==================================================

      - name: Verify frontend builds
        run: |
          echo "Checking web build..."

          test -f apps/web/dist/index.html

          echo "Web build OK"

          echo "Checking admin build..."

          test -f apps/admin/dist/index.html

          echo "Admin build OK"

          echo ""
          echo "Web dist:"
          find apps/web/dist -maxdepth 2 -type f | head -30

          echo ""
          echo "Admin dist:"
          find apps/admin/dist -maxdepth 2 -type f | head -30


      # ==================================================
      # SETUP SSH
      # ==================================================

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VDS_SSH_PRIVATE_KEY }}
          VDS_HOST: ${{ secrets.VDS_HOST }}

        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$VDS_HOST" >> ~/.ssh/known_hosts


      # ==================================================
      # PREPARE VDS
      # ==================================================

      - name: Prepare VDS
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}

        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            "$VDS_USER@$VDS_HOST" << 'EOF'

            set -e

            echo "Preparing VDS..."

            mkdir -p ~/slideforge

            mkdir -p /home/encode/eduslides/apps/web/dist

            mkdir -p /home/encode/eduslides/apps/admin/dist

            echo "VDS directories ready."

          EOF


      # ==================================================
      # COPY PROJECT TO VDS
      # ==================================================

      - name: Copy project to VDS
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}

        run: |
          rsync -az --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".env" \
            --exclude "node_modules/" \
            --exclude "dist/" \
            --exclude "build/" \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            ./ "$VDS_USER@$VDS_HOST:~/slideforge/"


      # ==================================================
      # DEPLOY WEB DIST
      # ==================================================

      - name: Deploy web frontend
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}

        run: |
          echo "Copying web frontend..."

          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            apps/web/dist/ \
            "$VDS_USER@$VDS_HOST:/home/encode/eduslides/apps/web/dist/"

          echo "Web frontend deployed."


      # ==================================================
      # DEPLOY ADMIN DIST
      # ==================================================

      - name: Deploy admin frontend
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}

        run: |
          echo "Copying admin frontend..."

          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            apps/admin/dist/ \
            "$VDS_USER@$VDS_HOST:/home/encode/eduslides/apps/admin/dist/"

          echo "Admin frontend deployed."


      # ==================================================
      # VALIDATE DOCKER COMPOSE
      # ==================================================

      - name: Validate Docker Compose
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}

        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            "$VDS_USER@$VDS_HOST" << 'EOF'

            set -e

            cd ~/slideforge

            echo "Validating Docker Compose..."

            docker compose config

            echo "Docker Compose configuration is valid."

          EOF


      # ==================================================
      # DEPLOY DOCKER
      # ==================================================

      - name: Deploy Docker
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}

        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            "$VDS_USER@$VDS_HOST" << 'EOF'

            set -e

            cd ~/slideforge

            echo "========================================="
            echo "Building Docker containers"
            echo "========================================="

            docker compose build

            echo "========================================="
            echo "Starting Docker containers"
            echo "========================================="

            docker compose up -d

            echo "========================================="
            echo "Waiting for services"
            echo "========================================="

            sleep 10

            docker compose ps

            echo "========================================="
            echo "Checking API inside container"
            echo "========================================="

            docker compose exec -T api \
              wget -qO- http://127.0.0.1:8080/actuator/health

            echo

            echo "========================================="
            echo "Cleaning old Docker images"
            echo "========================================="

            docker image prune -f

            echo "Docker deployment completed."

          EOF


      # ==================================================
      # CHECK API
      # ==================================================

      - name: Check API
        run: |
          echo "Checking API..."

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 30 \
            https://api-eduslides.encode.uz/actuator/health

          echo

          echo "API check successful."


      # ==================================================
      # CHECK FRONTEND
      # ==================================================

      - name: Check frontend
        run: |
          echo "Checking frontend..."

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 30 \
            https://eduslides.encode.uz/

          echo

          echo "Frontend check successful."


      # ==================================================
      # CHECK ADMIN
      # ==================================================

      - name: Check admin
        run: |
          echo "Checking admin..."

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 30 \
            https://admin-eduslides.encode.uz/

          echo

          echo "Admin check successful."


      # ==================================================
      # COMPLETE
      # ==================================================

      - name: Deployment completed
        run: |
          echo "========================================="
          echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "========================================="