name: Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==================================================
      # SSH
      # ==================================================

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VDS_SSH_PRIVATE_KEY }}
          VDS_HOST: ${{ secrets.VDS_HOST }}

        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$VDS_HOST" >> ~/.ssh/known_hosts


      # ==================================================
      # PREPARE VDS
      # ==================================================

      - name: Prepare VDS
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}

        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            "$VDS_USER@$VDS_HOST" << 'EOF'

            set -e

            mkdir -p ~/slideforge

            echo "VDS deployment directory ready."

          EOF


      # ==================================================
      # COPY SOURCE CODE
      # ==================================================

      - name: Copy project to VDS
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}

        run: |
          rsync -az --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".env" \
            --exclude "node_modules/" \
            --exclude "dist/" \
            --exclude "build/" \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            ./ "$VDS_USER@$VDS_HOST:~/slideforge/"


      # ==================================================
      # BUILD FRONTEND + ADMIN + DOCKER
      # ==================================================

      - name: Build and deploy on VDS
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}

        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            "$VDS_USER@$VDS_HOST" << 'EOF'

            set -e

            cd ~/slideforge

            echo ""
            echo "========================================="
            echo "Installing frontend dependencies"
            echo "========================================="

            cd apps/web

            npm ci

            echo ""
            echo "Building frontend..."

            npm run build

            cd ../admin

            echo ""
            echo "========================================="
            echo "Installing admin dependencies"
            echo "========================================="

            npm ci

            echo ""
            echo "Building admin..."

            npm run build

            cd ../..

            echo ""
            echo "========================================="
            echo "Frontend build results"
            echo "========================================="

            ls -lah apps/web/dist

            echo ""
            echo "Admin build results"

            ls -lah apps/admin/dist

            echo ""
            echo "========================================="
            echo "Validating Docker Compose"
            echo "========================================="

            docker compose config

            echo ""
            echo "========================================="
            echo "Building Docker containers"
            echo "========================================="

            docker compose build

            echo ""
            echo "========================================="
            echo "Starting Docker containers"
            echo "========================================="

            docker compose up -d

            echo ""
            echo "Waiting for services..."

            sleep 10

            echo ""
            echo "========================================="
            echo "Docker Compose status"
            echo "========================================="

            docker compose ps

            echo ""
            echo "========================================="
            echo "Checking API inside container"
            echo "========================================="

            docker compose exec -T api \
              wget -qO- http://127.0.0.1:8080/actuator/health

            echo

            echo ""
            echo "========================================="
            echo "Cleaning old Docker images"
            echo "========================================="

            docker image prune -f

            echo ""
            echo "Docker deployment completed."

          EOF


      # ==================================================
      # CHECK API
      # ==================================================

      - name: Check API
        run: |
          echo "Checking API..."

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 30 \
            https://api-eduslides.encode.uz/actuator/health

          echo

          echo "API check successful."


      # ==================================================
      # CHECK FRONTEND
      # ==================================================

      - name: Check frontend
        run: |
          echo "Checking frontend..."

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 30 \
            https://eduslides.encode.uz/

          echo

          echo "Frontend check successful."


      # ==================================================
      # CHECK ADMIN
      # ==================================================

      - name: Check admin
        run: |
          echo "Checking admin..."

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 30 \
            https://admin-eduslides.encode.uz/

          echo

          echo "Admin check successful."


      # ==================================================
      # COMPLETE
      # ==================================================

      - name: Deployment completed
        run: |
          echo ""
          echo "========================================="
          echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "========================================="