name: Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup SSH
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VDS_SSH_PRIVATE_KEY }}
          VDS_HOST: ${{ secrets.VDS_HOST }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$VDS_HOST" >> ~/.ssh/known_hosts

      # 3. Prepare deployment directory
      - name: Prepare VDS
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              -o IdentitiesOnly=yes \
              "$VDS_USER@$VDS_HOST" << 'EOF'

            set -e

            mkdir -p ~/slideforge

            echo "VDS deployment directory ready."

          EOF

      # 4. Copy project to VDS
      - name: Copy project to VDS
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}
        run: |
          rsync -az --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".env" \
            --exclude "node_modules/" \
            --exclude "dist/" \
            --exclude "build/" \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            ./ "$VDS_USER@$VDS_HOST:~/slideforge/"

      # 5. Build and start Docker containers
      - name: Deploy Docker
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              -o IdentitiesOnly=yes \
              "$VDS_USER@$VDS_HOST" << 'EOF'

            set -e

            cd ~/slideforge

            echo "Building containers..."
            docker compose build

            echo "Starting containers..."
            docker compose up -d

            echo "Removing unused images..."
            docker image prune -f

            echo "Deployment completed."

            echo "Container status:"
            docker compose ps

          EOF

      # 6. Check frontend
      - name: Check frontend
        run: |
          curl --fail --silent --show-error \
            https://eduslides.encode.uz/

      # 7. Check admin
      - name: Check admin
        run: |
          curl --fail --silent --show-error \
            https://admin-eduslides.encode.uz/