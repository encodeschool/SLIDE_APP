name: Deploy

on:

  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # SSH SETUP
      # =====================================================

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VDS_SSH_PRIVATE_KEY }}
          VDS_HOST: ${{ secrets.VDS_HOST }}

        run: |

          set -e

          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$VDS_HOST" >> ~/.ssh/known_hosts


      # =====================================================
      # PREPARE VDS
      # =====================================================

      - name: Prepare VDS
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}

        run: |

          set -e

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            "$VDS_USER@$VDS_HOST" << 'EOF'

          set -e

          mkdir -p ~/slideforge

          echo "VDS deployment directory ready."

          EOF


      # =====================================================
      # COPY DOCKER PROJECT
      # =====================================================

      - name: Copy project to VDS
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}

        run: |

          set -e

          rsync -az --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".env" \
            --exclude "node_modules/" \
            --exclude "dist/" \
            --exclude "build/" \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            ./ \
            "$VDS_USER@$VDS_HOST:~/slideforge/"


      # =====================================================
      # DEPLOY DOCKER
      # =====================================================

      - name: Deploy Docker
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}

        run: |

          set -e

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            "$VDS_USER@$VDS_HOST" << 'EOF'

          set -e

          cd ~/slideforge

          echo ""
          echo "========================================="
          echo "Docker Compose Configuration"
          echo "========================================="

          docker compose config


          echo ""
          echo "========================================="
          echo "Building Docker Images"
          echo "========================================="

          docker compose build


          echo ""
          echo "========================================="
          echo "Starting Services"
          echo "========================================="

          docker compose up -d


          echo ""
          echo "========================================="
          echo "Container Status"
          echo "========================================="

          docker compose ps


          echo ""
          echo "========================================="
          echo "Cleaning Unused Images"
          echo "========================================="

          docker image prune -f


          echo ""
          echo "========================================="
          echo "Deployment Completed"
          echo "========================================="

          EOF


      # =====================================================
      # CHECK API
      # =====================================================

      - name: Check API
        run: |

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 30 \
            https://api-eduslides.encode.uz/


      # =====================================================
      # CHECK FRONTEND
      # =====================================================

      - name: Check frontend
        run: |

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 30 \
            https://eduslides.encode.uz/


      # =====================================================
      # CHECK ADMIN
      # =====================================================

      - name: Check admin
        run: |

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 30 \
            https://admin-eduslides.encode.uz/


      # =====================================================
      # DEPLOYMENT SUCCESS
      # =====================================================

      - name: Deployment successful
        run: |

          echo ""
          echo "========================================="
          echo "EDUSLIDES DEPLOYMENT SUCCESSFUL"
          echo "========================================="

          echo "Frontend:"
          echo "https://eduslides.encode.uz/"

          echo ""

          echo "Admin:"
          echo "https://admin-eduslides.encode.uz/"

          echo ""

          echo "API:"
          echo "https://api-eduslides.encode.uz/"

          echo "========================================="